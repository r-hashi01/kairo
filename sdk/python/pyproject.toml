[project]
name = "kairo-sdk"
version = "0.2.0"
description = "Durable workflows that run inside your Python process: a WASM core and your database (SQLite or PostgreSQL). No workflow server."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
keywords = ["workflow", "durable-execution", "workflow-engine", "serverless", "webassembly", "llm", "agents"]
dependencies = []

[project.urls]
Homepage = "https://github.com/r-hashi01/kairo"
Repository = "https://github.com/r-hashi01/kairo"
Documentation = "https://github.com/r-hashi01/kairo/blob/main/sdk/python/README.md"

[project.optional-dependencies]
# The runtime embedded here (ADR 0051): the WASM core needs a WASM runtime.
embedded = ["wasmtime"]
# Running Dify's workflow nodes (ADR 0028).
graphon = ["graphon==0.7.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# kairo_sdk.wasm holds only kairo.wasm (package data of kairo_sdk).
packages = ["kairo_sdk", "kairo_sdk.wasm"]

# kairo.wasm, built from the repository before packaging:
#   GOOS=wasip1 GOARCH=wasm go build -trimpath -buildmode=c-shared -o sdk/python/kairo_sdk/wasm/kairo.wasm ./cmd/kairo-wasm
[tool.setuptools.package-data]
"kairo_sdk.wasm" = ["kairo.wasm"]
