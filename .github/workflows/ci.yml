name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check (fmt, vet, build, tests, invariants, race)
        run: scripts/check.sh --race

  bench:
    # Shared CI runners are noisy; the budgets are reported, not enforced.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: non-functional budgets
        run: scripts/bench.sh
