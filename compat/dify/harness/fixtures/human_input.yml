# kairo's own fixture: a human input with two actions and a timeout, its
# submitted field read downstream (ADR 0036).
kind: app
version: 0.4.0
app: {mode: workflow, name: human_input}
workflow:
  conversation_variables: []
  environment_variables: []
  graph:
    nodes:
    - id: start
      data: {type: start, title: Start, variables: []}
    - id: review
      data:
        type: human-input
        title: Review
        form_content: "Please review. {{#$output.comment#}}"
        inputs: [{type: paragraph, output_variable_name: comment}]
        user_actions: [{id: approve, title: Approve}, {id: reject, title: Reject}]
        timeout: 2
        timeout_unit: day
    - id: approved
      data: {type: template-transform, title: Approved, template: approved, variables: []}
    - id: rejected
      data: {type: template-transform, title: Rejected, template: rejected, variables: []}
    - id: expired
      data: {type: template-transform, title: Expired, template: expired, variables: []}
    - id: agg
      data:
        type: variable-aggregator
        title: Join
        output_type: string
        variables: [[approved, output], [rejected, output], [expired, output]]
    - id: end
      data:
        type: end
        title: End
        outputs:
        - {variable: result, value_selector: [agg, output], value_type: string}
        - {variable: comment, value_selector: [review, comment], value_type: string}
    edges:
    - {source: start, target: review, sourceHandle: source}
    - {source: review, target: approved, sourceHandle: approve}
    - {source: review, target: rejected, sourceHandle: reject}
    - {source: review, target: expired, sourceHandle: __timeout}
    - {source: approved, target: agg, sourceHandle: source}
    - {source: rejected, target: agg, sourceHandle: source}
    - {source: expired, target: agg, sourceHandle: source}
    - {source: agg, target: end, sourceHandle: source}
