# Databases for the backend tests (ADR 0020). Started by
# scripts/check-backends.sh, which also generates the TLS certificates in
# store/.certs. Test-only credentials; never reuse them.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo-test
      POSTGRES_DB: kairo
    # PostgreSQL insists the key is 0600 and owned by its user: copy it in.
    entrypoint: ["/bin/sh", "-c", "install -o postgres -m 600 /certs/server.key /tmp/server.key && install -o postgres -m 644 /certs/server.crt /tmp/server.crt && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key"]
    volumes:
      - ./.certs:/certs:ro
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kairo"]
      interval: 2s
      retries: 60
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: kairo-root-test
      MYSQL_USER: kairo
      MYSQL_PASSWORD: kairo-test
      MYSQL_DATABASE: kairo
    # Use the test CA's certificate and refuse unencrypted connections.
    entrypoint: ["/bin/sh", "-c", "install -o mysql -m 600 /certs/server.key /tmp/server.key && install -o mysql -m 644 /certs/server.crt /tmp/server.crt && install -o mysql -m 644 /certs/ca.crt /tmp/ca.crt && exec docker-entrypoint.sh mysqld --ssl-ca=/tmp/ca.crt --ssl-cert=/tmp/server.crt --ssl-key=/tmp/server.key --require-secure-transport=ON"]
    volumes:
      - ./.certs:/certs:ro
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pkairo-root-test"]
      interval: 2s
      retries: 90
  tidb:
    image: pingcap/tidb:v8.5.1
    ports: ["127.0.0.1:54000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:10080/status || exit 1"]
      interval: 2s
      retries: 60
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: kairo-sys-test
      APP_USER: kairo
      APP_USER_PASSWORD: kairo-test
    ports: ["127.0.0.1:51521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 120
